<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#22c55e" stroke-opacity="0.25" stroke-width="3" />

  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="180" stroke="url(#emeraldGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 10" />

  <!-- Red Packet Body -->
  <rect x="136" y="112" width="240" height="310" rx="36" fill="url(#envelopeGrad)" filter="url(#glow)" />
  
  <!-- Envelope Flap Curved Arc -->
  <path d="M 136 148 C 136 148, 256 248, 376 148 L 376 112 C 376 92, 356 76, 336 76 L 176 76 C 156 76, 136 92, 136 112 Z" fill="#b91c1c" />
  <path d="M 136 148 C 136 148, 256 248, 376 148" stroke="url(#goldGrad)" stroke-width="4" fill="none" />

  <!-- Gold Border around Packet -->
  <rect x="136" y="112" width="240" height="310" rx="36" stroke="url(#goldGrad)" stroke-width="3" fill="none" opacity="0.8" />

  <!-- Central Crypto Gold Medallion / Coin -->
  <circle cx="256" cy="240" r="54" fill="url(#goldGrad)" />
  <circle cx="256" cy="240" r="48" fill="#0b1120" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Inner Crypto Node Glyph -->
  <path d="M 256 208 L 284 256 L 228 256 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linejoin="round" />
  <circle cx="256" cy="236" r="6" fill="#22c55e" />
  <circle cx="242" cy="260" r="4" fill="#f59e0b" />
  <circle cx="270" cy="260" r="4" fill="#f59e0b" />
  <line x1="256" y1="208" x2="256" y2="236" stroke="#22c55e" stroke-width="2" />
  <line x1="242" y1="260" x2="256" y2="236" stroke="#22c55e" stroke-width="2" />
  <line x1="270" y1="260" x2="256" y2="236" stroke="#22c55e" stroke-width="2" />
  <line x1="256" y1="242" x2="256" y2="272" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Little Star/Spark Accent -->
  <polygon points="340,140 344,148 352,152 344,156 340,164 336,156 328,152 336,148" fill="#fef08a" />
</svg>
